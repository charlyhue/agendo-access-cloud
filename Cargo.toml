[package]
name = "agendo-access-cloud"
description = "Plan de contrôle et portail d'Agendo Access : comptes sur invitation, rattachement des maisons, jetons, ACME DNS-01"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[dependencies]
# Protocole commun et WebAuthn : dépôt du socle, branche `agendo-access`. En CI et dans
# l'image, `git config url.….insteadOf` renvoie cette URL vers GitHub (docs/deploy.md).
agendo-access-protocol = { git = "file:///Users/chue/workspace/agendo", branch = "agendo-access" }
agendo-webauthn = { git = "file:///Users/chue/workspace/agendo", branch = "agendo-access" }

anyhow = "1"
askama = "0.16"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
