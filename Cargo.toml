[package]
name = "agendo-access-cloud"
description = "Plan de contrôle et portail d'Agendo Access : comptes sur invitation, rattachement des maisons, jetons, ACME DNS-01"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[dependencies]
# Protocole commun et WebAuthn : dépôt privé du socle, par SSH, à un tag publié. Cargo passe
# par `git` et `ssh` (`.cargo/config.toml`) : agent SSH en local, clé de déploiement en CI
# (docs/deploy.md, « Socle et clé de déploiement »).
agendo-access-protocol = { git = "ssh://git@github.com/charlyhue/agendo.git", tag = "v0.42.0" }
agendo-webauthn = { git = "ssh://git@github.com/charlyhue/agendo.git", tag = "v0.42.0" }

anyhow = "1"
askama = "0.16"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
